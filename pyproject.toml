[project]
name = "unicon-forge"
version = "0.17.1"
description = "The Unicon contest API as a Python package: domain, services, tables, and the forge port with its implementations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "psycopg[binary]>=3.3.5",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    "cryptography>=50.0.1",
    "itsdangerous>=2.2.0",
    "pyyaml>=6.0.3",
    "regex>=2026.1",
    "boto3>=1.43.104",
    "jsonschema[format-nongpl]>=4.26.0",
]

[project.scripts]
unicon-forge = "forge.cli:main"

[project.urls]
Source = "https://github.com/uniconhq/forge"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "import-linter>=2.15",
    "types-pyyaml>=6.0.12.20260906",
    "types-regex>=2026.9.10.20260911",
    "types-boto3[s3]>=1.43.104",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"forge/db/alembic/versions/*" = ["E501", "I001"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["forge", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = ["live: needs a running forge, named by UNICON_LIVE_FORGE_URL"]

[tool.importlinter]
root_package = "forge"

[[tool.importlinter.contracts]]
name = "domain, services and db never import a forge implementation"
type = "forbidden"
source_modules = ["forge.domain", "forge.services", "forge.db"]
forbidden_modules = ["forge.forges"]

[[tool.importlinter.contracts]]
name = "only runtime and testing build a forge implementation"
type = "forbidden"
source_modules = [
    "forge.api",
    "forge.cli",
    "forge.db",
    "forge.domain",
    "forge.log",
    "forge.port",
    "forge.services",
    "forge.settings",
]
forbidden_modules = ["forge.forges"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "the Forgejo implementation never imports services or db"
type = "forbidden"
source_modules = ["forge.forges.forgejo"]
forbidden_modules = ["forge.services", "forge.db"]

[[tool.importlinter.contracts]]
name = "the in-memory implementation never imports services, db or runtime"
type = "forbidden"
source_modules = ["forge.forges.fake"]
forbidden_modules = ["forge.services", "forge.db", "forge.runtime"]

[[tool.importlinter.contracts]]
name = "domain imports nothing else in the package"
type = "forbidden"
source_modules = ["forge.domain"]
forbidden_modules = ["forge.services", "forge.db", "forge.port", "forge.forges", "forge.log"]
