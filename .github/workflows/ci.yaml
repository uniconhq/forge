name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      UNICON_TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.13
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run mypy
      - run: uv run pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: 0.12.13
      - run: uv build
      - name: The built version matches pyproject
        run: |
          declared="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          ls dist/unicon_forge-"$declared"-py3-none-any.whl dist/unicon_forge-"$declared".tar.gz
